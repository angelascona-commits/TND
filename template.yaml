      RequestMappingTemplate: >
        #set($pId = $ctx.args.input.productId.toUpperCase().replace("PROD#", ""))
        #set($cat = $util.defaultIfNullOrBlank($ctx.args.input.categoryId, "GENERAL").toUpperCase().replace("CAT#", ""))
