AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Retail Inventory System - GraphQL API con AWS AppSync y DynamoDB Single Table Design

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: provided.al2023
    Architectures:
      - x86_64
    Environment:
      Variables:
        MAIN_TABLE: !Ref RetailMainTable

Resources:
  RetailMainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-retail-table"
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1_PK
          AttributeType: S
        - AttributeName: GSI1_SK
          AttributeType: S
        - AttributeName: GSI2_PK
          AttributeType: S
        - AttributeName: GSI2_SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1_PK
              KeyType: HASH
            - AttributeName: GSI1_SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2_PK
              KeyType: HASH
            - AttributeName: GSI2_SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  AppSyncServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - appsync.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: AppSyncDDBAndLambdaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt RetailMainTable.Arn
                  - !Sub "${RetailMainTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt CreateOrderFunction.Arn

  AppSyncApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub "${AWS::StackName}-graphql-api"
      AuthenticationType: API_KEY

  AppSyncApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      Description: Default API Key for Retail Inventory Frontend

  AppSyncSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      DefinitionS3Location: ./schema.graphql

  DDBDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      Name: RetailDDBDataSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      DynamoDBConfig:
        TableName: !Ref RetailMainTable
        AwsRegion: !Ref AWS::Region

  CreateOrderDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      Name: CreateOrderLambdaDataSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt CreateOrderFunction.Arn

  # =========================================================================
  # QUERIES - RESOLVERS DIRECTOS A DYNAMODB
  # =========================================================================

  ListCatalogsResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: listCatalogs
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($cat = $ctx.args.category.toUpperCase().replace("CATALOG#", ""))
        {
          "version": "2017-02-28",
          "operation": "Query",
          "query": {
            "expression": "PK = :pk AND begins_with(SK, :skPrefix)",
            "expressionValues": {
              ":pk": $util.dynamodb.toDynamoDBJson("CATALOG#${cat}"),
              ":skPrefix": $util.dynamodb.toDynamoDBJson("ITEM#")
            }
          }
        }
      ResponseMappingTemplate: $util.toJson($ctx.result.items)

  GetEntityResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: getEntity
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($cleanId = $ctx.args.dniRuc.toUpperCase().replace("USER#", ""))
        {
          "version": "2017-02-28",
          "operation": "GetItem",
          "key": {
            "PK": $util.dynamodb.toDynamoDBJson("USER#${cleanId}"),
            "SK": $util.dynamodb.toDynamoDBJson("PROFILE")
          }
        }
      ResponseMappingTemplate: $util.toJson($ctx.result)

  ListEntitiesResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: listEntities
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($rol = $util.defaultIfNullOrBlank($ctx.args.rol, "Cliente"))
        #set($hasZona = !$util.isNullOrBlank($ctx.args.zona))
        {
          "version": "2017-02-28",
          "operation": "Query",
          "index": "GSI2",
          #if( $hasZona )
            #set($cleanZona = $ctx.args.zona.toUpperCase().replace("ZONE#", ""))
            "query": {
              "expression": "GSI2_PK = :gsi2pk AND begins_with(GSI2_SK, :zonePrefix)",
              "expressionValues": {
                ":gsi2pk": $util.dynamodb.toDynamoDBJson("ROL#${rol}"),
                ":zonePrefix": $util.dynamodb.toDynamoDBJson("ZONE#${cleanZona}")
              }
            }
          #else
            "query": {
              "expression": "GSI2_PK = :gsi2pk",
              "expressionValues": {
                ":gsi2pk": $util.dynamodb.toDynamoDBJson("ROL#${rol}")
              }
            }
          #end
        }
      ResponseMappingTemplate: $util.toJson($ctx.result.items)

  GetProductResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: getProduct
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($cleanId = $ctx.args.productId.toUpperCase().replace("PROD#", ""))
        {
          "version": "2017-02-28",
          "operation": "GetItem",
          "key": {
            "PK": $util.dynamodb.toDynamoDBJson("PROD#${cleanId}"),
            "SK": $util.dynamodb.toDynamoDBJson("INFO_BASE")
          }
        }
      ResponseMappingTemplate: $util.toJson($ctx.result)

  ListProductsResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: listProducts
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($hasCat = !$util.isNullOrBlank($ctx.args.category))
        #set($hasBrand = !$util.isNullOrBlank($ctx.args.brand))
        #set($cat = $util.defaultIfNullOrBlank($ctx.args.category, "GENERAL").toUpperCase().replace("CAT#", ""))
        {
          "version": "2017-02-28",
          "operation": "Query",
          "index": "GSI2",
          #if( $hasBrand )
            #set($brand = $ctx.args.brand.toUpperCase().replace("BRAND#", ""))
            "query": {
              "expression": "GSI2_PK = :gsi2pk AND GSI2_SK = :gsi2sk",
              "expressionValues": {
                ":gsi2pk": $util.dynamodb.toDynamoDBJson("CAT#${cat}"),
                ":gsi2sk": $util.dynamodb.toDynamoDBJson("BRAND#${brand}")
              }
            }
          #else
            "query": {
              "expression": "GSI2_PK = :gsi2pk",
              "expressionValues": {
                ":gsi2pk": $util.dynamodb.toDynamoDBJson("CAT#${cat}")
              }
            }
          #end
        }
      ResponseMappingTemplate: $util.toJson($ctx.result.items)

  ListProductSKUsResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: listProductSKUs
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($cleanId = $ctx.args.productId.toUpperCase().replace("PROD#", ""))
        {
          "version": "2017-02-28",
          "operation": "Query",
          "query": {
            "expression": "PK = :pk AND begins_with(SK, :skPrefix)",
            "expressionValues": {
              ":pk": $util.dynamodb.toDynamoDBJson("PROD#${cleanId}"),
              ":skPrefix": $util.dynamodb.toDynamoDBJson("SKU#")
            }
          }
        }
      ResponseMappingTemplate: $util.toJson($ctx.result.items)

  ListProductSerialsResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: listProductSerials
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($cleanId = $ctx.args.productId.toUpperCase().replace("PROD#", ""))
        {
          "version": "2017-02-28",
          "operation": "Query",
          "query": {
            "expression": "PK = :pk AND begins_with(SK, :skPrefix)",
            "expressionValues": {
              ":pk": $util.dynamodb.toDynamoDBJson("PROD#${cleanId}"),
              ":skPrefix": $util.dynamodb.toDynamoDBJson("SN#")
            }
          }
        }
      ResponseMappingTemplate: $util.toJson($ctx.result.items)

  GetOrderResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: getOrder
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($cleanId = $ctx.args.trxId.toUpperCase().replace("TRX#", ""))
        {
          "version": "2017-02-28",
          "operation": "GetItem",
          "key": {
            "PK": $util.dynamodb.toDynamoDBJson("TRX#${cleanId}"),
            "SK": $util.dynamodb.toDynamoDBJson("HEADER")
          }
        }
      ResponseMappingTemplate: >
        #if( $util.isNull($ctx.result) )
          null
        #else
          {
            "header": $util.toJson($ctx.result)
          }
        #end

  ListOrdersResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: listOrders
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($hasUser = !$util.isNullOrBlank($ctx.args.user))
        #set($hasTipo = !$util.isNullOrBlank($ctx.args.tipo))
        #set($hasFrom = !$util.isNullOrBlank($ctx.args.fromDate))
        #set($hasTo = !$util.isNullOrBlank($ctx.args.toDate))
        #if( $hasUser )
          #set($cleanUser = $ctx.args.user.toUpperCase().replace("USER#", ""))
          {
            "version": "2017-02-28",
            "operation": "Query",
            "index": "GSI1",
            "query": {
              #if( $hasFrom && $hasTo )
                "expression": "GSI1_PK = :gsi1pk AND GSI1_SK BETWEEN :from AND :to",
                "expressionValues": {
                  ":gsi1pk": $util.dynamodb.toDynamoDBJson("USER#${cleanUser}"),
                  ":from": $util.dynamodb.toDynamoDBJson($ctx.args.fromDate),
                  ":to": $util.dynamodb.toDynamoDBJson($ctx.args.toDate)
                }
              #else
                "expression": "GSI1_PK = :gsi1pk",
                "expressionValues": {
                  ":gsi1pk": $util.dynamodb.toDynamoDBJson("USER#${cleanUser}")
                }
              #end
            },
            "scanIndexForward": false
          }
        #else
          #set($tipo = $util.defaultIfNullOrBlank($ctx.args.tipo, "Venta"))
          {
            "version": "2017-02-28",
            "operation": "Query",
            "index": "GSI2",
            "query": {
              #if( $hasFrom && $hasTo )
                "expression": "GSI2_PK = :gsi2pk AND GSI2_SK BETWEEN :from AND :to",
                "expressionValues": {
                  ":gsi2pk": $util.dynamodb.toDynamoDBJson("TYPE#${tipo}"),
                  ":from": $util.dynamodb.toDynamoDBJson($ctx.args.fromDate),
                  ":to": $util.dynamodb.toDynamoDBJson($ctx.args.toDate)
                }
              #else
                "expression": "GSI2_PK = :gsi2pk",
                "expressionValues": {
                  ":gsi2pk": $util.dynamodb.toDynamoDBJson("TYPE#${tipo}")
                }
              #end
            },
            "scanIndexForward": false
          }
        #end
      ResponseMappingTemplate: $util.toJson($ctx.result.items)

  SearchWarrantyBySNResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: searchWarrantyBySN
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($cleanSN = $ctx.args.serialNumber.toUpperCase().replace("SN#", ""))
        {
          "version": "2017-02-28",
          "operation": "Query",
          "index": "GSI1",
          "query": {
            "expression": "GSI1_PK = :gsi1pk",
            "expressionValues": {
              ":gsi1pk": $util.dynamodb.toDynamoDBJson("SN#${cleanSN}")
            }
          }
        }
      ResponseMappingTemplate: >
        {
          "serialNumber": $util.toJson($ctx.args.serialNumber),
          "records": $util.toJson($ctx.result.items)
        }

  # =========================================================================
  # RESOLVERS ANIDADOS (Product.variantes, Product.seriales, OrderFull.detalles)
  # =========================================================================

  ProductVariantesResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Product
      FieldName: variantes
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($pId = $ctx.source.productId.toUpperCase().replace("PROD#", ""))
        {
          "version": "2017-02-28",
          "operation": "Query",
          "query": {
            "expression": "PK = :pk AND begins_with(SK, :skPrefix)",
            "expressionValues": {
              ":pk": $util.dynamodb.toDynamoDBJson("PROD#${pId}"),
              ":skPrefix": $util.dynamodb.toDynamoDBJson("SKU#")
            }
          }
        }
      ResponseMappingTemplate: $util.toJson($ctx.result.items)

  ProductSerialesResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Product
      FieldName: seriales
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($pId = $ctx.source.productId.toUpperCase().replace("PROD#", ""))
        {
          "version": "2017-02-28",
          "operation": "Query",
          "query": {
            "expression": "PK = :pk AND begins_with(SK, :skPrefix)",
            "expressionValues": {
              ":pk": $util.dynamodb.toDynamoDBJson("PROD#${pId}"),
              ":skPrefix": $util.dynamodb.toDynamoDBJson("SN#")
            }
          }
        }
      ResponseMappingTemplate: $util.toJson($ctx.result.items)

  OrderFullDetallesResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: OrderFull
      FieldName: detalles
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($trxId = $ctx.source.header.trxId.toUpperCase().replace("TRX#", ""))
        {
          "version": "2017-02-28",
          "operation": "Query",
          "query": {
            "expression": "PK = :pk AND begins_with(SK, :skPrefix)",
            "expressionValues": {
              ":pk": $util.dynamodb.toDynamoDBJson("TRX#${trxId}"),
              ":skPrefix": $util.dynamodb.toDynamoDBJson("DETAIL#")
            }
          }
        }
      ResponseMappingTemplate: $util.toJson($ctx.result.items)

  # =========================================================================
  # MUTATIONS - DIRECTAS A DYNAMODB
  # =========================================================================

  CreateCatalogResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Mutation
      FieldName: createCatalog
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($cat = $ctx.args.input.category.toUpperCase().replace("CATALOG#", ""))
        #set($rawItemId = $util.defaultIfNullOrBlank($ctx.args.input.itemId, $ctx.args.input.label.toUpperCase().replace(" ", "_")))
        #set($itemId = $rawItemId.toUpperCase().replace("ITEM#", ""))
        #set($isActive = $util.defaultIfNull($ctx.args.input.isActive, true))
        #set($sortOrder = $util.defaultIfNull($ctx.args.input.sortOrder, 1))
        {
          "version": "2017-02-28",
          "operation": "PutItem",
          "key": {
            "PK": $util.dynamodb.toDynamoDBJson("CATALOG#${cat}"),
            "SK": $util.dynamodb.toDynamoDBJson("ITEM#${itemId}")
          },
          "attributeValues": {
            "category": $util.dynamodb.toDynamoDBJson($cat),
            "itemId": $util.dynamodb.toDynamoDBJson($itemId),
            "label": $util.dynamodb.toDynamoDBJson($ctx.args.input.label),
            "isActive": $util.dynamodb.toDynamoDBJson($isActive),
            "sortOrder": $util.dynamodb.toDynamoDBJson($sortOrder)
          }
        }
      ResponseMappingTemplate: $util.toJson($ctx.result)

  UpdateCatalogResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Mutation
      FieldName: updateCatalog
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($cat = $ctx.args.input.category.toUpperCase().replace("CATALOG#", ""))
        #set($itemId = $ctx.args.input.itemId.toUpperCase().replace("ITEM#", ""))
        {
          "version": "2017-02-28",
          "operation": "UpdateItem",
          "key": {
            "PK": $util.dynamodb.toDynamoDBJson("CATALOG#${cat}"),
            "SK": $util.dynamodb.toDynamoDBJson("ITEM#${itemId}")
          },
          "update": {
            "expression": "SET #lbl = :lbl, isActive = :act, sortOrder = :sort",
            "expressionNames": {
              "#lbl": "label"
            },
            "expressionValues": {
              ":lbl": $util.dynamodb.toDynamoDBJson($ctx.args.input.label),
              ":act": $util.dynamodb.toDynamoDBJson($util.defaultIfNull($ctx.args.input.isActive, true)),
              ":sort": $util.dynamodb.toDynamoDBJson($util.defaultIfNull($ctx.args.input.sortOrder, 1))
            }
          }
        }
      ResponseMappingTemplate: $util.toJson($ctx.result)

  DeleteCatalogResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Mutation
      FieldName: deleteCatalog
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($cat = $ctx.args.category.toUpperCase().replace("CATALOG#", ""))
        #set($itemId = $ctx.args.itemId.toUpperCase().replace("ITEM#", ""))
        {
          "version": "2017-02-28",
          "operation": "DeleteItem",
          "key": {
            "PK": $util.dynamodb.toDynamoDBJson("CATALOG#${cat}"),
            "SK": $util.dynamodb.toDynamoDBJson("ITEM#${itemId}")
          }
        }
      ResponseMappingTemplate: "true"

  CreateEntityResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Mutation
      FieldName: createEntity
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($dniRuc = $ctx.args.input.dniRuc.toUpperCase().replace("USER#", ""))
        #set($rol = $util.defaultIfNullOrBlank($ctx.args.input.rol, "Cliente"))
        #set($zona = $util.defaultIfNullOrBlank($ctx.args.input.zona, "").toUpperCase().replace("ZONE#", ""))
        #if( !$util.isNullOrBlank($zona) )
          #set($gsi2sk = "ZONE#${zona}#USER#${dniRuc}")
        #else
          #set($gsi2sk = "USER#${dniRuc}")
        #end
        {
          "version": "2017-02-28",
          "operation": "PutItem",
          "key": {
            "PK": $util.dynamodb.toDynamoDBJson("USER#${dniRuc}"),
            "SK": $util.dynamodb.toDynamoDBJson("PROFILE")
          },
          "attributeValues": {
            "dniRuc": $util.dynamodb.toDynamoDBJson($dniRuc),
            "nombre": $util.dynamodb.toDynamoDBJson($ctx.args.input.nombre),
            "rol": $util.dynamodb.toDynamoDBJson($rol),
            "zona": $util.dynamodb.toDynamoDBJson($ctx.args.input.zona),
            "correo": $util.dynamodb.toDynamoDBJson($ctx.args.input.correo),
            "telefono": $util.dynamodb.toDynamoDBJson($ctx.args.input.telefono),
            "direccion": $util.dynamodb.toDynamoDBJson($ctx.args.input.direccion),
            "GSI2_PK": $util.dynamodb.toDynamoDBJson("ROL#${rol}"),
            "GSI2_SK": $util.dynamodb.toDynamoDBJson($gsi2sk)
          }
        }
      ResponseMappingTemplate: $util.toJson($ctx.result)

  UpdateEntityResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Mutation
      FieldName: updateEntity
      DataSourceName: !GetAtt DDBDataSource.Name
      RequestMappingTemplate: >
        #set($dniRuc = $ctx.args.input.dniRuc.toUpperCase().replace("USER#", ""))
        #set($rol = $util.defaultIfNullOrBlank($ctx.args.input.rol, "Cliente"))
        #set($zona = $util.defaultIfNullOrBlank($ctx.args.input.zona, "").toUpperCase().replace("ZONE#", ""))
        #if( !$util.isNullOrBlank($zona) )
          #set($gsi2sk = "ZONE#${zona}#USER#${dniRuc}")
        #else
          #set($gsi2sk = "USER#${dniRuc}")
        #end
        {
          "version": "2017-02-28",
          "operation": "UpdateItem",
          "key": {
            "PK": $util.dynamodb.toDynamoDBJson("USER#${dniRuc}"),
            "SK": $util.dynamodb.toDynamoDBJson("PROFILE")
          },
          "update": {
            "expression": "SET nombre = :nom, rol = :rol, zona = :zona, correo = :cor, telefono = :tel, direccion = :dir, GSI2_PK = :gsi2pk, GSI2_SK = :gsi2sk",
            "expressionValues": {
              ":nom": $util.dynamodb.toDynamoDBJson($ctx.args.input.nombre),
              ":rol": $util.dynamodb.toDynamoDBJson($rol),
              ":zona": $util.dynamodb.toDynamoDBJson($ctx.args.input.zona),
              ":cor": $util.dynamodb.toDynamoDBJson($ctx.args.input.correo),
              ":tel": $util.dynamodb.toDynamoDBJson($ctx.args.input.telefono),
              ":dir": $util.dynamodb.toDynamoDBJson($ctx.args.input.direccion),
              ":gsi2pk": $util.dynamodb.toDynamoDBJson("ROL#${rol}"),
              ":gsi2sk": $util.dynamodb.toDynamoDBJson($gsi2sk)
            }
          }
        }
      ResponseMappingTemplate: $util.toJson($ctx.result)

  DeleteEntityResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: AppSyncSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Mutation
      FieldName: deleteEntity
      DataSourceName: !GetAtt DDBDataSource.Name
