AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Retail Inventory System - Single Table Design DynamoDB (Catálogos, Entidades, Productos y Transacciones con PATCH)

Globals:
  Function:
    Timeout: 5
    MemorySize: 128
    Runtime: provided.al2023
    Architectures:
      - x86_64
    Environment:
      Variables:
        MAIN_TABLE: !Ref RetailMainTable

Resources:
  # --- TABLA ÚNICA DYNAMODB (SINGLE-TABLE DESIGN) ---
  RetailMainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-retail-table"
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1_PK
          AttributeType: S
        - AttributeName: GSI1_SK
          AttributeType: S
        - AttributeName: GSI2_PK
          AttributeType: S
        - AttributeName: GSI2_SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1_PK
              KeyType: HASH
            - AttributeName: GSI1_SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2_PK
              KeyType: HASH
            - AttributeName: GSI2_SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  # --- API GATEWAY REST ---
  RetailApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  # --- DOMINIO 1: CATÁLOGOS GLOBALES (PARAMETRÍA) ---
  ListCatalogsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: catalogs/list/
      Handler: bootstrap
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /catalogs
            Method: GET

  CreateCatalogFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: catalogs/create/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /catalogs
            Method: POST

  UpdateCatalogFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: catalogs/update/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /catalogs
            Method: PATCH

  DeleteCatalogFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: catalogs/delete/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /catalogs
            Method: DELETE

  # --- DOMINIO 2: ENTIDADES (CLIENTES Y PROVEEDORES) ---
  ListEntitiesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: entities/list/
      Handler: bootstrap
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /entities
            Method: GET

  CreateEntityFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: entities/create/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /entities
            Method: POST

  GetEntityFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: entities/get/
      Handler: bootstrap
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /entities/{id}
            Method: GET

  UpdateEntityFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: entities/update/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /entities
            Method: PATCH

  DeleteEntityFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: entities/delete/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /entities/{id}
            Method: DELETE

  # --- DOMINIO 3: INVENTARIO Y PRODUCTOS (MICROSERVICIOS INDEPENDIENTES CON NOMENCLATURA EXPLÍCITA) ---

  # 3.1 PRODUCTO BASE (INFO_BASE)
  ListProductsBaseFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: products/list-base/
      Handler: bootstrap
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /products
            Method: GET

  GetProductBaseFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: products/get-base/
      Handler: bootstrap
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /products/{id}
            Method: GET

  CreateProductBaseFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: products/create-base/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /products
            Method: POST

  UpdateProductBaseFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: products/update-base/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /products
            Method: PATCH

  DeleteProductBaseFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: products/delete-base/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /products/{id}
            Method: DELETE

  # 3.2 VARIANTES DE PRODUCTO (SKU)
  ListProductSkuFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: products/list-sku/
      Handler: bootstrap
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /products/{id}/skus
            Method: GET

  CreateProductSkuFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: products/create-sku/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /products/{id}/skus
            Method: POST

  GetProductSkuFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: products/get-sku/
      Handler: bootstrap
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /products/{id}/skus/{skuId}
            Method: GET

  UpdateProductSkuFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: products/update-sku/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /products/{id}/skus
            Method: PATCH

  DeleteProductSkuFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: products/delete-sku/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /products/{id}/skus/{skuId}
            Method: DELETE

  # 3.3 UNIDADES SERIALIZADAS FÍSICAS (SN)
  ListProductSerialFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: products/list-serial/
      Handler: bootstrap
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /products/{id}/serials
            Method: GET

  CreateProductSerialFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: products/create-serial/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /products/{id}/serials
            Method: POST

  GetProductSerialFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: products/get-serial/
      Handler: bootstrap
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /products/serials/{sn}
            Method: GET

  UpdateProductSerialFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: products/update-serial/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /products/{id}/serials
            Method: PATCH

  DeleteProductSerialFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: products/delete-serial/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /products/{id}/serials/{sn}
            Method: DELETE

  # --- DOMINIO 4: TRANSACCIONES (COMPRAS Y VENTAS) ---
  ListOrdersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: orders/list-order/
      Handler: bootstrap
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /orders
            Method: GET

  SearchOrderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: orders/search-order/
      Handler: bootstrap
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /orders/search
            Method: GET

  GetOrderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: orders/get-order/
      Handler: bootstrap
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /orders/{id}
            Method: GET

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: orders/create-order/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /orders
            Method: POST

  UpdateOrderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: orders/update-order/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /orders
            Method: PATCH

  DeleteOrderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: orders/delete-order/
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RetailMainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RetailApi
            Path: /orders/{id}
            Method: DELETE

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${RetailApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  MainTableName:
    Description: "Nombre de la Tabla Única en DynamoDB"
    Value: !Ref RetailMainTable