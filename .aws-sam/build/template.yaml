AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Retail Inventory System - Serverless REST API (3 Tablas Unificadas +\
  \ Tabla Global de Cat\xE1logos PK/SK)\n"
Globals:
  Function:
    Timeout: 5
    MemorySize: 128
    Runtime: provided.al2023
    Architectures:
    - x86_64
    Environment:
      Variables:
        ENTITIES_TABLE:
          Ref: EntitiesTable
        PRODUCTS_TABLE:
          Ref: ProductsTable
        ORDERS_TABLE:
          Ref: OrdersTable
        CATALOGS_TABLE:
          Ref: CatalogsTable
Resources:
  CatalogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-catalogs
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
  EntitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-entities
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-products
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-orders
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
  RetailApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''*'''
  ListCatalogsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: ListCatalogsFunction
    Properties:
      CodeUri: ListCatalogsFunction
      Handler: bootstrap
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: CatalogsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: RetailApi
            Path: /catalogs
            Method: GET
  CreateCatalogFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: CreateCatalogFunction
    Properties:
      CodeUri: CreateCatalogFunction
      Handler: bootstrap
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: CatalogsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: RetailApi
            Path: /catalogs
            Method: POST
  ListEntitiesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: ListEntitiesFunction
    Properties:
      CodeUri: ListEntitiesFunction
      Handler: bootstrap
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EntitiesTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: RetailApi
            Path: /entities
            Method: GET
  GetEntityFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: GetEntityFunction
    Properties:
      CodeUri: GetEntityFunction
      Handler: bootstrap
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EntitiesTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: RetailApi
            Path: /entities/{id}
            Method: GET
  CreateEntityFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: CreateEntityFunction
    Properties:
      CodeUri: CreateEntityFunction
      Handler: bootstrap
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: EntitiesTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: RetailApi
            Path: /entities
            Method: POST
  GetEntityHistoryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: GetEntityHistoryFunction
    Properties:
      CodeUri: GetEntityHistoryFunction
      Handler: bootstrap
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: OrdersTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: RetailApi
            Path: /entities/{id}/orders
            Method: GET
  ListProductsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: ListProductsFunction
    Properties:
      CodeUri: ListProductsFunction
      Handler: bootstrap
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: ProductsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: RetailApi
            Path: /products
            Method: GET
  GetProductFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: GetProductFunction
    Properties:
      CodeUri: GetProductFunction
      Handler: bootstrap
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: ProductsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: RetailApi
            Path: /products/{id}
            Method: GET
  SearchProductsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: SearchProductsFunction
    Properties:
      CodeUri: SearchProductsFunction
      Handler: bootstrap
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: ProductsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: RetailApi
            Path: /products/search
            Method: GET
  CreateProductFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: CreateProductFunction
    Properties:
      CodeUri: CreateProductFunction
      Handler: bootstrap
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ProductsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: RetailApi
            Path: /products
            Method: POST
  DeleteProductFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: DeleteProductFunction
    Properties:
      CodeUri: DeleteProductFunction
      Handler: bootstrap
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ProductsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: RetailApi
            Path: /products/{id}
            Method: DELETE
  ListOrdersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: ListOrdersFunction
    Properties:
      CodeUri: ListOrdersFunction
      Handler: bootstrap
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: OrdersTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: RetailApi
            Path: /orders
            Method: GET
  GetOrderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: GetOrderFunction
    Properties:
      CodeUri: GetOrderFunction
      Handler: bootstrap
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: OrdersTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: RetailApi
            Path: /orders/{id}
            Method: GET
  SearchOrdersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: SearchOrdersFunction
    Properties:
      CodeUri: SearchOrdersFunction
      Handler: bootstrap
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: OrdersTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: RetailApi
            Path: /orders/search
            Method: GET
  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: CreateOrderFunction
    Properties:
      CodeUri: CreateOrderFunction
      Handler: bootstrap
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: OrdersTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ProductsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: RetailApi
            Path: /orders
            Method: POST
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${RetailApi}.execute-api.${AWS::Region}.amazonaws.com/prod/
